<a class="skip" href="#main" (click)="$event.preventDefault(); main.focus()">Skip to content</a>
<app-navbar (menuToggle)="toggleSidebar()" />
<app-sidebar [open]="sidebarOpen()" (itemSelected)="closeSidebar()" />
@if (sidebarOpen()) {
  <button
    class="backdrop"
    type="button"
    aria-label="Close navigation menu"
    (click)="closeSidebar()"
  ></button>
}
<main id="main" class="content" tabindex="-1" #main>
  <router-outlet />
</main>
