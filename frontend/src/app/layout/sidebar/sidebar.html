<nav id="sidebar" class="sidebar" [class.open]="open()" aria-label="Main">
  <ul>
    @for (item of items(); track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="itemSelected.emit()"
          >{{ item.label }}</a
        >
      </li>
    }
  </ul>
</nav>
